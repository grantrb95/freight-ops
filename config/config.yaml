# ============================================================================
# H-4 Strategic Solutions LLC - Freight Operations Configuration
# ============================================================================

# Company Information
company:
  name: "H-4 Strategic Solutions LLC"
  dot_number: "4486526"
  mc_number: "MC-1772833-C"
  
# Home Base Location
home_base:
  city: "Fort Gibson"
  state: "OK"
  coordinates:
    latitude: 35.7987
    longitude: -95.2500

# Equipment Configuration
equipment:
  truck:
    year: 2025
    make: "Dodge"
    model: "Ram 3500"
    engine: "6.7L Cummins HO turbo-diesel"  # 420 hp / 1,075 lb-ft, severe-duty schedule
    mpg: 9
    fuel_tank_gallons: 32

  trailer:
    type: "gooseneck"
    subtype: "flatbed"
    make: "MAXX-D"
    model: "YHX"  # 40-ft hydraulic dovetail gooseneck, tandem axle, hydraulic brakes
    length_ft: 40
    max_weight_lbs: 16500
    suspension: "air_ride"
    # Deck features (capabilities, not type-level distinctions). Keep this list
    # extensible so adding a step-deck or lowboy later doesn't force a refactor.
    features:
      - "dovetail"
      - "winch"

# Current odometer / hub-mile readings, with provenance for staleness checks.
# A reading older than 7 days triggers a warning in the maintenance report.
odometers:
  truck:
    miles: 30100
    last_verified_date: "2026-05-27"
    source: "Motive ELD"
  # The gooseneck has no independent hub odometer; its mileage tracks the truck
  # while coupled. Mileage-based trailer items are evaluated from in-service date.

# Operating Costs
costs:
  fuel_cost_per_gallon: 3.50
  cost_per_mile: 0.39
  insurance_monthly: 1500
  truck_payment_monthly: 1200
  trailer_payment_monthly: 400
  maintenance_reserve_per_mile: 0.10
  
# Rate Thresholds
rates:
  minimum_rate_per_mile: 2.00
  target_rate_per_mile: 2.50
  premium_rate_per_mile: 3.00
  max_deadhead_miles: 150
  max_deadhead_percentage: 20

# Operating Area
operating_area:
  preferred_states:
    - "OK"
    - "TX"
    - "AR"
    - "KS"
    - "MO"
    - "LA"
  max_radius_miles: 1000
  
# IFTA Tracking
ifta:
  enabled: true
  home_state: "OK"

# Load Board Preferences  
load_boards:
  dat:
    enabled: true
    search_radius_miles: 250
  truckstop:
    enabled: true
    search_radius_miles: 250

# Maintenance Tracking
maintenance:
  # Flag a service as "due soon" when within either threshold.
  due_soon_miles: 500
  due_soon_days: 14
  # Services that must be dealer-performed to preserve the factory powertrain /
  # emissions warranty on the 6.7L Cummins. Edit as warranty terms dictate.
  warranty_critical:
    - fuel_filter        # Cummins fuel/emissions system
    - coolant_flush      # powertrain cooling
    - transmission_service  # powertrain
    - def_system         # emissions (SCR/DEF)
  # Recurring service intervals per equipment category.
  # Each item must define at least one of: miles, months.
  schedules:
    truck:
      - type: oil_change
        miles: 7500
        months: 6
      - type: tire_rotation
        miles: 7500
      - type: fuel_filter
        miles: 15000
      - type: air_filter
        miles: 15000
      - type: transmission_service
        miles: 60000
      - type: coolant_flush
        months: 60
      - type: dot_inspection
        months: 12
    trailer:
      - type: wheel_bearing
        miles: 12000
        months: 12
      - type: brake_service
        miles: 24000
      - type: tire_replacement
        months: 72
      - type: dot_inspection
        months: 12
  # Completed-service seed. PROVISIONAL until verified against paperwork
  # (pending Matt verification). Set `verification: verified` once confirmed.
  service_history:
    # --- Truck (2025 Ram 3500) ---
    - unit: truck
      type: dot_inspection
      date: "2026-01-11"
      odometer: 0
    - unit: truck
      type: fuel_filter
      date: "2026-02-21"
      odometer: 8061
      description: "Both fuel filters replaced"
    - unit: truck
      type: tire_rotation
      date: "2026-03-07"
      odometer: 10717
      vendor: "FTG Tire and Wheel"
    - unit: truck
      type: oil_change
      date: "2026-03-15"
      odometer: 13840
    # --- Trailer (MAXX-D YHX) ---
    - unit: trailer
      type: dot_inspection
      date: "2026-01-11"
      odometer: 0
    # No other trailer service performed yet; first intervals run from in-service date.

# Logging
logging:
  level: "INFO"