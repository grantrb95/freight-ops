# ============================================================================
# H-4 Strategic Solutions LLC - Freight Operations Configuration
# ============================================================================

# Company Information
company:
  name: "H-4 Strategic Solutions LLC"
  dot_number: "4486526"
  mc_number: "MC-1772833-C"
  
# Home Base Location
home_base:
  city: "Fort Gibson"
  state: "OK"
  coordinates:
    latitude: 35.7987
    longitude: -95.2500

# Equipment Configuration
equipment:
  truck:
    year: 2025
    make: "Dodge"
    model: "Ram 3500"
    mpg: 9
    fuel_tank_gallons: 32
    
  trailer:
    type: "gooseneck"
    subtype: "flatbed"
    length_ft: 40
    max_weight_lbs: 16500

# Operating Costs
costs:
  fuel_cost_per_gallon: 3.50
  cost_per_mile: 0.39
  insurance_monthly: 1500
  truck_payment_monthly: 1200
  trailer_payment_monthly: 400
  maintenance_reserve_per_mile: 0.10
  
# Rate Thresholds
rates:
  minimum_rate_per_mile: 2.00
  target_rate_per_mile: 2.50
  premium_rate_per_mile: 3.00
  max_deadhead_miles: 150
  max_deadhead_percentage: 20

# Operating Area
operating_area:
  preferred_states:
    - "OK"
    - "TX"
    - "AR"
    - "KS"
    - "MO"
    - "LA"
  max_radius_miles: 1000
  
# IFTA Tracking
ifta:
  enabled: true
  home_state: "OK"

# Load Board Preferences  
load_boards:
  dat:
    enabled: true
    search_radius_miles: 250
  truckstop:
    enabled: true
    search_radius_miles: 250

# Maintenance Tracking
maintenance:
  # Flag a service as "due soon" when within either threshold.
  due_soon_miles: 500
  due_soon_days: 14
  # Recurring service intervals per equipment category.
  # Each item must define at least one of: miles, months.
  schedules:
    truck:
      - type: oil_change
        miles: 7500
        months: 6
      - type: tire_rotation
        miles: 7500
      - type: fuel_filter
        miles: 15000
      - type: air_filter
        miles: 15000
      - type: transmission_service
        miles: 60000
      - type: coolant_flush
        months: 60
      - type: dot_inspection
        months: 12
    trailer:
      - type: wheel_bearing
        miles: 12000
        months: 12
      - type: brake_service
        miles: 24000
      - type: tire_replacement
        months: 72
      - type: dot_inspection
        months: 12

# Logging
logging:
  level: "INFO"